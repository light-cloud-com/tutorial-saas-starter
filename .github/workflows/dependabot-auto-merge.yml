# Generated by awesome-templates/scripts/build-repo-files.mjs.
# Delete this first line to edit the workflow by hand; the script then leaves it alone.
# Turns on auto-merge for Dependabot minor and patch updates, so they merge themselves once
# the required CI check passes. Majors are ignored in dependabot.yml and done by hand.
name: Dependabot auto-merge

on: pull_request

permissions: {}

jobs:
  auto-merge:
    name: Dependabot auto-merge
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read the update type
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Merge minor and patch updates when CI passes
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
