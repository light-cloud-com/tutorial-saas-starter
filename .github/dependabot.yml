# Generated by awesome-templates/scripts/build-repo-files.mjs. Delete this line to edit by hand.
# Weekly updates: one grouped pull request per ecosystem for minor and patch releases, which
# dependabot-auto-merge.yml merges once CI passes. Major releases are ignored here and upgraded
# by hand; security updates still come through (update-types does not filter them).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: Dependencies # Dependabot adds the colon: "Dependencies: bump ..."
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: Dependencies # Dependabot adds the colon: "Dependencies: bump ..."
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
