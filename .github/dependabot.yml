# Generated by awesome-templates/scripts/build-repo-files.mjs. Delete this line to edit by hand.
# Weekly updates, one grouped pull request per ecosystem for minor and patch releases;
# major releases come one per pull request, and each ecosystem keeps at most 2 open.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: Dependencies # Dependabot adds the colon: "Dependencies: bump ..."
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: Dependencies # Dependabot adds the colon: "Dependencies: bump ..."
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
